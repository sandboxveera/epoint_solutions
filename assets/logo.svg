<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e096"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#e6c865"/>
    </linearGradient>

    <!-- Dark Emerald Background Gradient for Standalone Badges -->
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063931"/>
      <stop offset="100%" stop-color="#021c17"/>
    </linearGradient>

    <!-- Gold Glow Effect -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Globe Latitude / Longitude Ellipses -->
    <ellipse cx="95" cy="85" rx="52" ry="52" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4"/>
    <ellipse cx="95" cy="85" rx="52" ry="24" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
    <ellipse cx="95" cy="85" rx="24" ry="52" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="43" y1="85" x2="147" y2="85" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>

    <!-- Central Stylized 'e' letterform -->
    <path d="M 115 72 C 115 60, 104 52, 92 52 C 76 52, 66 65, 66 85 C 66 105, 78 116, 94 116 C 108 116, 116 107, 118 97 L 103 97 C 101 101, 97 105, 93 105 C 84 105, 78 98, 78 87 L 115 87 C 115 82, 115 76, 115 72 Z M 78 77 C 80 68, 86 62, 92 62 C 98 62, 103 67, 103 77 L 78 77 Z" fill="url(#goldGrad)"/>

    <!-- Upward Sweeping Arrow Curve around Globe -->
    <path d="M 52 118 C 65 142, 102 152, 138 132 C 152 124, 164 112, 172 96 L 158 98 C 152 110, 142 120, 131 126 C 101 142, 69 134, 57 114 Z" fill="url(#goldGrad)"/>

    <!-- Arrow Head pointing Up-Right -->
    <polygon points="172,82 178,106 156,98" fill="url(#goldGrad)"/>
  </g>
</svg>
